services:
  app:
    image: ghcr.io/trakli/webservice:latest
    restart: unless-stopped
    command: ["sh", "-c", "php artisan migrate --force && exec frankenphp run --config /etc/caddy/Caddyfile"]
    environment: &laravel
      APP_NAME: Trakli
      APP_ENV: production
      APP_KEY: ${APP_KEY}
      APP_URL: ${APP_URL}
      DB_CONNECTION: mysql
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: trakli
      DB_USERNAME: trakli
      DB_PASSWORD: ${DB_PASSWORD}
      CACHE_STORE: database
      SESSION_DRIVER: database
      QUEUE_CONNECTION: database
      BROADCAST_DRIVER: reverb
      REVERB_APP_ID: trakli
      REVERB_APP_KEY: trakli
      REVERB_APP_SECRET: ${REVERB_APP_SECRET}
      REVERB_HOST: reverb
      REVERB_PORT: 8080
      REVERB_SCHEME: http
      MAIL_MAILER: smtp
      MAIL_HOST: mailhog
      MAIL_PORT: 1025
    volumes:
      - ./storage:/var/www/html/storage
    depends_on:
      mysql:
        condition: service_healthy
  worker:
    image: ghcr.io/trakli/webservice:latest
    restart: unless-stopped
    command: php artisan queue:work --tries=3 --timeout=120
    environment: *laravel
    depends_on:
      app:
        condition: service_started
  reverb:
    image: ghcr.io/trakli/webservice:latest
    restart: unless-stopped
    command: php artisan reverb:start --host=0.0.0.0 --port=8080
    environment: *laravel
    depends_on:
      mysql:
        condition: service_healthy
  smartql:
    image: ghcr.io/smartql/smartql:latest
    restart: unless-stopped
    command: ["smartql", "serve", "-c", "/app/smartql.yml", "--host", "0.0.0.0", "--port", "8000"]
    environment:
      SMARTQL_CONFIG: /app/smartql.yml
      DB_HOST: mysql
      DB_PORT: 3306
      DB_DATABASE: trakli
      DB_USERNAME: trakli
      DB_PASSWORD: ${DB_PASSWORD}
      LLM_PROVIDER: gemini
      LLM_MODEL: gemini-2.0-flash
      GEMINI_API_KEY: ${GEMINI_API_KEY}
      LLM_TEMPERATURE: "0.1"
      LLM_RETRIES: "3"
    volumes:
      - ./smartql.yml:/app/smartql.yml:ro
    depends_on:
      mysql:
        condition: service_healthy
  mysql:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_DATABASE: trakli
      MYSQL_USER: trakli
      MYSQL_PASSWORD: ${DB_PASSWORD}
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD}
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "127.0.0.1", "-p${DB_PASSWORD}"]
      interval: 5s
      timeout: 5s
      retries: 20
    volumes:
      - ./data/mysql:/var/lib/mysql
  phpmyadmin:
    image: phpmyadmin/phpmyadmin:latest
    restart: unless-stopped
    environment:
      PMA_HOST: mysql
    depends_on:
      - mysql
  mailhog:
    image: mailhog/mailhog:latest
    restart: unless-stopped
