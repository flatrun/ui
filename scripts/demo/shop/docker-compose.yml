services:
  web:
    image: nginx:alpine
    depends_on: [api]
  api:
    image: node:22-alpine
    command: node -e "require('http').createServer((q,s)=>s.end('ok')).listen(3000)"
    environment:
      DATABASE_URL: postgres://shop@db:5432/shop
      REDIS_URL: redis://cache:6379
    depends_on: [db, cache, storage]
  worker:
    image: node:22-alpine
    command: node -e "setInterval(()=>{},1<<30)"
    depends_on: [db, cache]
    deploy:
      replicas: 2
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: shop
      POSTGRES_HOST_AUTH_METHOD: trust
    volumes:
      - ./data/postgres:/var/lib/postgresql/data
  cache:
    image: redis:7-alpine
    volumes:
      - ./data/redis:/data
  storage:
    image: minio/minio:latest
    command: server /data
    volumes:
      - ./data/minio:/data
