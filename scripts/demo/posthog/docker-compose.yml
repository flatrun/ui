# Adapted from PostHog's docker-compose.hobby.yml (MIT), flattened into one file.
services:
  asyncmigrationscheck:
    command: python manage.py run_async_migrations --check
    deploy:
      replicas: 0
    environment:
      - 'API_QUERIES_PER_TEAM={"1": 100}'
      - CDP_API_URL=http://plugins:6738
      - DEPLOYMENT=hobby
      - KAFKA_HOSTS=kafka
      - OTEL_SDK_DISABLED=true
      - PERSONS_DB_READER_URL=postgres://posthog:posthog@db:5432/posthog
      - PERSONS_DB_WRITER_URL=postgres://posthog:posthog@db:5432/posthog
      - SKIP_ASYNC_MIGRATIONS_SETUP=0
      - SECRET_KEY=$POSTHOG_SECRET
      - SITE_URL=https://$DOMAIN
    image: $REGISTRY_URL:$POSTHOG_APP_TAG
    restart: "no"
  browserless:
    environment:
      DEBUG: -*
      LOG_LEVEL: warn
      TOKEN: ${BROWSERLESS_SECRET:-$POSTHOG_SECRET}
    image: ghcr.io/browserless/chromium:v2.51.2
    restart: on-failure
  capture:
    environment:
      ADDRESS: 0.0.0.0:3000
      CAPTURE_MODE: events
      CAPTURE_OUTPUT_ANALYTICS_MAIN_TOPIC: events_plugin_ingestion
      CAPTURE_OUTPUT_ERROR_TRACKING_TOPIC: ingestion-errortracking-main
      KAFKA_ERROR_TRACKING_TOPIC: ingestion-errortracking-main
      KAFKA_HOSTS: kafka:9092
      KAFKA_INGESTION_PRODUCER_METADATA_BROKER_LIST: kafka:9092
      KAFKA_TOPIC: events_plugin_ingestion
      REDIS_URL: redis://redis7:6379/
      RUST_LOG: info,rdkafka=warn
    image: ghcr.io/posthog/posthog/capture:master
    restart: on-failure
  capture-ai:
    environment:
      ADDRESS: 0.0.0.0:3000
      AI_MAX_EVENT_BYTES: "900000"
      CAPTURE_MODE: ai
      CAPTURE_OUTPUT_ANALYTICS_MAIN_TOPIC: events_plugin_ingestion_ai
      KAFKA_HOSTS: kafka:9092
      KAFKA_INGESTION_PRODUCER_METADATA_BROKER_LIST: kafka:9092
      KAFKA_PRODUCER_MESSAGE_MAX_BYTES: "1000000"
      KAFKA_TOPIC: events_plugin_ingestion_ai
      REDIS_URL: redis://redis7:6379/
      RUST_LOG: info,rdkafka=warn
    image: ghcr.io/posthog/posthog/capture:master
    restart: on-failure
  capture-logs:
    environment:
      BIND_HOST: 0.0.0.0
      BIND_PORT: "4318"
      JWT_SECRET: <randomly generated secret key>
      KAFKA_HOSTS: kafka:9092
      KAFKA_METRICS_TOPIC: metrics_ingestion
      KAFKA_TOPIC: logs_ingestion
      RUST_BACKTRACE: "1"
      RUST_LOG: info,rdkafka=warn
    image: ghcr.io/posthog/posthog/capture-logs:master
    restart: on-failure
  clickhouse:
    depends_on:
      kafka:
        condition: service_started
        required: true
      zookeeper:
        condition: service_started
        required: true
    environment:
      CLICKHOUSE_SKIP_USER_SETUP: 1
      KAFKA_HOSTS: kafka:9092
    healthcheck:
      interval: 3s
      retries: 10
      test:
        - CMD-SHELL
        - wget --no-verbose --tries=1 --spider http://localhost:8123/ping || exit 1
      timeout: 10s
    image: ${CLICKHOUSE_SERVER_IMAGE:-clickhouse/clickhouse-server:26.9.13.15}
    restart: on-failure
    volumes:
      - ./posthog/posthog/idl:/idl
      - ./posthog/docker/clickhouse/docker-entrypoint-initdb.d:/docker-entrypoint-initdb.d
      - ./posthog/docker/clickhouse/config.xml:/etc/clickhouse-server/config.xml
      - ./posthog/docker/clickhouse/config.d/default.xml:/etc/clickhouse-server/config.d/default.xml
      - ./posthog/docker/clickhouse/users.xml:/etc/clickhouse-server/users.xml
      - ./posthog/docker/clickhouse/user_defined_function.xml:/etc/clickhouse-server/user_defined_function.xml
      - ./posthog/posthog/user_scripts:/var/lib/clickhouse/user_scripts
      - ./data/clickhouse-data:/var/lib/clickhouse
  cymbal:
    depends_on:
      cymbal-resolution:
        condition: service_started
        required: true
      db:
        condition: service_healthy
        required: true
      kafka-init:
        condition: service_completed_successfully
        required: true
      redis7:
        condition: service_healthy
        required: true
      seaweedfs:
        condition: service_healthy
        required: true
    environment:
      BIND_HOST: 0.0.0.0
      BIND_PORT: "3302"
      CYMBAL_REMOTE_RESOLUTION_HOST: cymbal-resolution
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      INTERNAL_API_SECRET: $POSTHOG_SECRET
      ISSUE_BUCKETS_REDIS_URL: redis://redis7:6379/
      KAFKA_HOSTS: kafka:9092
      MAXMIND_DB_PATH: /share/GeoLite2-City.mmdb
      OBJECT_STORAGE_ACCESS_KEY_ID: any
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_ENDPOINT: http://seaweedfs:8333
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: any
      PERSONS_URL: postgres://posthog:posthog@db:5432/posthog
      REDIS_URL: redis://redis7:6379/
      RUST_LOG: info
    image: ghcr.io/posthog/posthog/cymbal:master
    restart: on-failure
    volumes:
      - ./share:/share
  cymbal-resolution:
    depends_on:
      db:
        condition: service_healthy
        required: true
      seaweedfs:
        condition: service_healthy
        required: true
    environment:
      CYMBAL_MODE: resolution
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      GRPC_ADDRESS: 0.0.0.0:50061
      INTERNAL_API_SECRET: $POSTHOG_SECRET
      OBJECT_STORAGE_ACCESS_KEY_ID: any
      OBJECT_STORAGE_BUCKET: posthog
      OBJECT_STORAGE_ENDPOINT: http://seaweedfs:8333
      OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
      OBJECT_STORAGE_SECRET_ACCESS_KEY: any
      RUST_LOG: info
    image: ghcr.io/posthog/posthog/cymbal:master
    restart: on-failure
  db:
    environment:
      POSTGRES_DB: posthog
      POSTGRES_PASSWORD: posthog
      POSTGRES_USER: posthog
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 10s
      test:
        - CMD-SHELL
        - pg_isready -U posthog -h 127.0.0.1
      timeout: 30s
    image: ${DOCKER_REGISTRY_PREFIX:-}postgres:15.12-alpine
    restart: on-failure
    volumes:
      - ./docker/postgres-init-scripts:/docker-entrypoint-initdb.d
      - ./products:/products:ro
      - ./data/postgres-data:/var/lib/postgresql/data
  elasticsearch:
    environment:
      - cluster.routing.allocation.disk.threshold_enabled=true
      - cluster.routing.allocation.disk.watermark.low=512mb
      - cluster.routing.allocation.disk.watermark.high=256mb
      - cluster.routing.allocation.disk.watermark.flood_stage=128mb
      - discovery.type=single-node
      - ES_JAVA_OPTS=-Xms256m -Xmx256m
      - xpack.security.enabled=false
    expose:
      - 9200
    healthcheck:
      interval: 10s
      retries: 30
      start_period: 60s
      test:
        - CMD-SHELL
        - curl -s http://localhost:9200/_cluster/health | grep -qE "\"status\":\"(green|yellow)\""
      timeout: 10s
    image: elasticsearch:7.17.28
    volumes:
      - ./data/elasticsearch-data:/var/lib/elasticsearch/data
  feature-flags:
    depends_on:
      db:
        condition: service_started
        required: true
      objectstorage:
        condition: service_healthy
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      - ADDRESS=0.0.0.0:3001
      - COOKIELESS_REDIS_HOST=redis7
      - COOKIELESS_REDIS_PORT=6379
      - MAXMIND_DB_PATH=/share/GeoLite2-City.mmdb
      - PERSONS_READ_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - PERSONS_WRITE_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - READ_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - REDIS_URL=redis://redis7:6379/
      - RUST_LOG=info
      - WRITE_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - AWS_ACCESS_KEY_ID=object_storage_root_user
      - AWS_SECRET_ACCESS_KEY=object_storage_root_password
      - INTERNAL_REQUEST_TOKEN=${INTERNAL_REQUEST_TOKEN:-}
      - OBJECT_STORAGE_ENDPOINT=http://objectstorage:19000
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 10s
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3001/_readiness
      timeout: 5s
    image: ghcr.io/posthog/posthog/feature-flags:master
    restart: on-failure
    volumes:
      - ./share:/share
  hypercache-server:
    depends_on:
      objectstorage:
        condition: service_healthy
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      - ADDRESS=0.0.0.0:3002
      - REDIS_URL=redis://redis7:6379/
      - RUST_LOG=info
      - AWS_ACCESS_KEY_ID=object_storage_root_user
      - AWS_SECRET_ACCESS_KEY=object_storage_root_password
      - OBJECT_STORAGE_ENDPOINT=http://objectstorage:19000
    healthcheck:
      interval: 5s
      retries: 12
      start_period: 10s
      test:
        - CMD
        - curl
        - -f
        - http://localhost:3002/_readiness
      timeout: 5s
    image: ghcr.io/posthog/posthog/hypercache-server:master
    restart: on-failure
  ingestion-error-tracking:
    command: node nodejs/dist/index.js
    depends_on:
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      - CDP_REDIS_HOST=redis7
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - ENCRYPTION_SALT_KEYS=$ENCRYPTION_SALT_KEYS
      - KAFKA_HOSTS=kafka:9092
      - PLUGIN_SERVER_MODE=ingestion-errortracking
      - REDIS_URL=redis://redis7:6379/
      - ERROR_TRACKING_CYMBAL_BASE_URL=http://cymbal:3302
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    restart: on-failure
  ingestion-general:
    command: node nodejs/dist/index.js
    depends_on:
      clickhouse:
        condition: service_started
        required: true
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      objectstorage:
        condition: service_started
        required: true
      personhog-router:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      - AI_BLOB_OFFLOAD_TEAMS=*
      - AI_BLOB_S3_ACCESS_KEY_ID=object_storage_root_user
      - AI_BLOB_S3_BUCKET=ai-blobs
      - AI_BLOB_S3_ENDPOINT=http://objectstorage:19000
      - AI_BLOB_S3_PREFIX=aio/
      - AI_BLOB_S3_REGION=us-east-1
      - AI_BLOB_S3_SECRET_ACCESS_KEY=object_storage_root_password
      - BEHAVIORAL_COHORTS_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - CDP_REDIS_HOST=redis7
      - CLICKHOUSE_DATABASE=posthog
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_VERIFY=false
      - COOKIELESS_REDIS_HOST=redis7
      - COOKIELESS_REDIS_PORT=6379
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - ENCRYPTION_SALT_KEYS=$ENCRYPTION_SALT_KEYS
      - KAFKA_HOSTS=kafka:9092
      - PERSONS_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - PLUGIN_SERVER_MODE=ingestion-v2-combined
      - REDIS_URL=redis://redis7:6379/
      - PERSONHOG_ADDR=personhog-router:50052
      - PERSONHOG_ENABLED=true
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    restart: on-failure
  ingestion-logs:
    command: node nodejs/dist/index.js
    depends_on:
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      - CDP_REDIS_HOST=redis7
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - ENCRYPTION_SALT_KEYS=${ENCRYPTION_SALT_KEYS}
      - KAFKA_HOSTS=kafka:9092
      - LOGS_REDIS_HOST=redis7
      - PLUGIN_SERVER_MODE=ingestion-logs
      - REDIS_URL=redis://redis7:6379/
      - LOGS_REDIS_TLS=false
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    restart: on-failure
  ingestion-sessionreplay:
    command: node nodejs/dist/index.js
    depends_on:
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
      seaweedfs:
        condition: service_started
        required: true
    environment:
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - KAFKA_HOSTS=kafka:9092
      - PLUGIN_SERVER_MODE=recordings-blob-ingestion-v2
      - REDIS_URL=redis://redis7:6379/
      - ENCRYPTION_SALT_KEYS=$ENCRYPTION_SALT_KEYS
      - SESSION_RECORDING_V2_S3_ACCESS_KEY_ID=any
      - SESSION_RECORDING_V2_S3_ENDPOINT=http://seaweedfs:8333
      - SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY=any
      - SESSION_RECORDING_V2_S3_TIMEOUT_MS=120000
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    restart: on-failure
  ingestion-traces:
    command: node nodejs/dist/index.js
    depends_on:
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
    environment:
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - KAFKA_HOSTS=kafka:9092
      - PLUGIN_SERVER_MODE=ingestion-traces
      - REDIS_URL=redis://redis7:6379/
      - TRACES_REDIS_HOST=redis7
      - TRACES_REDIS_TLS=false
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    restart: on-failure
  kafka:
    command:
      - redpanda
      - start
      - --kafka-addr internal://0.0.0.0:9092,external://0.0.0.0:19092
      - --advertise-kafka-addr internal://kafka:9092,external://localhost:19092
      - --pandaproxy-addr internal://0.0.0.0:8082,external://0.0.0.0:18082
      - --advertise-pandaproxy-addr internal://kafka:8082,external://localhost:18082
      - --schema-registry-addr internal://0.0.0.0:8081,external://0.0.0.0:18081
      - --rpc-addr kafka:33145
      - --advertise-rpc-addr kafka:33145
      - --mode dev-container
      - --smp 2
      - --memory 3G
      - --reserve-memory 500M
      - --overprovisioned
      - --set redpanda.empty_seed_starts_cluster=false
      - --seeds kafka:33145
      - --set redpanda.auto_create_topics_enabled=true
    depends_on:
      zookeeper:
        condition: service_started
        required: true
    environment:
      - ALLOW_PLAINTEXT_LISTENER=true
      - KAFKA_LOG_RETENTION_CHECK_INTERVAL_MS=300000
      - KAFKA_LOG_RETENTION_HOURS=1
      - KAFKA_LOG_RETENTION_MS=3600000
    healthcheck:
      interval: 3s
      retries: 10
      test: curl -f http://localhost:9644/v1/status/ready || exit 1
      timeout: 10s
    image: docker.io/redpandadata/redpanda:v25.1.9
    restart: on-failure
    ulimits:
      nofile:
        hard: 65536
        soft: 65536
    volumes:
      - ./data/redpanda-data:/var/lib/redpanda/data
      - ./data/kafka-data:/bitnami/kafka
  kafka-init:
    command:
      - -c
      - "set -x\necho \"Waiting for Kafka broker to accept connections...\"\nTIMEOUT=60\nELAPSED=0\n# Use rpk topic list as\
        \ the readiness check - it's a simple operation\n# that confirms the broker is accepting Kafka protocol requests\nuntil\
        \ rpk topic list --brokers kafka:9092 2>/dev/null; do\n    echo \"Kafka broker not ready yet (elapsed: $${ELAPSED}s)...\"\
        \n    sleep 2\n    ELAPSED=$$((ELAPSED + 2))\n    if [ $$ELAPSED -ge $$TIMEOUT ]; then\n        echo \"Timeout waiting\
        \ for Kafka broker after $${TIMEOUT}s\"\n        echo \"Final attempt to list topics:\"\n        rpk topic list --brokers\
        \ kafka:9092 || true\n        exit 1\n    fi\ndone\necho \"Kafka broker is accepting requests, creating topics...\"\n\
        # The topic list is docker/kafka/topics.txt, mounted below, shared with\n# docker-compose.dev.yml so the two stacks\
        \ cannot drift apart. That header\n# explains what needs pre-creating.\n# Note: $$ escapes $ for docker-compose variable\
        \ substitution\nTOPICS=$$(grep -vE '^[[:space:]]*#|^[[:space:]]*$$' /topics.txt)\nfor topic in $$TOPICS; do\n    if\
        \ rpk topic create \"$$topic\" --brokers kafka:9092 -p 1 -r 1 2>&1; then\n        echo \"Topic $$topic created successfully\"\
        \n    else\n        if rpk topic list --brokers kafka:9092 | awk '{print $$1}' | grep -qx \"$$topic\"; then\n      \
        \      echo \"Topic $$topic already exists, continuing\"\n        else\n            echo \"Failed to create topic $$topic\"\
        \n            exit 1\n        fi\n    fi\ndone\necho \"Final topic list:\"\nrpk topic list --brokers kafka:9092\necho\
        \ \"Topics ready\"\n"
    depends_on:
      kafka:
        condition: service_healthy
        required: true
    entrypoint: /bin/sh
    image: docker.io/redpandadata/redpanda:v25.1.9
    volumes:
      - ./posthog/docker/kafka/topics.txt:/topics.txt:ro
  livestream:
    depends_on:
      kafka:
        condition: service_started
        required: true
    environment:
      - LIVESTREAM_JWT_SECRET=${POSTHOG_SECRET}
    image: ghcr.io/posthog/posthog/livestream:master
    restart: on-failure
    volumes:
      - ./posthog/docker/livestream/configs-hobby.yml:/configs/configs.yml
  objectstorage:
    command:
      - server
      - -master.port=19001
      - -s3
      - -s3.port=19000
      - -dir=/data
      - -volume.max=1000
      - -master.volumePreallocate=false
    entrypoint:
      - /bin/sh
      - -c
      - "(\n    while true; do\n        printf 's3.configure -access_key=object_storage_root_user -secret_key=object_storage_root_password\
        \ -user=posthog -actions=Admin -apply\\ns3.bucket.create -name posthog\\ns3.bucket.create -name ai-blobs\\n' \\\n  \
        \              | /usr/bin/weed shell -master=localhost:19001 >/dev/null 2>&1 || true\n        if echo 's3.bucket.list'\
        \ | /usr/bin/weed shell -master=localhost:19001 2>/dev/null | grep -q ai-blobs \\\n                && echo 's3.configure'\
        \ | /usr/bin/weed shell -master=localhost:19001 2>/dev/null | grep -q object_storage_root_user; then\n            touch\
        \ /tmp/objectstorage-ready\n            echo \"Objectstorage SeaweedFS ready with required buckets and identities\"\n\
        \            break\n        fi\n        sleep 1\n    done\n) &\nexec /usr/bin/weed \"$$@\"\n"
      - --
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 10s
      test:
        - CMD
        - test
        - -f
        - /tmp/objectstorage-ready
      timeout: 5s
    image: chrislusf/seaweedfs:4.29
    restart: on-failure
    volumes:
      - ./data/objectstorage-data:/data
  personhog-replica:
    depends_on:
      db:
        condition: service_healthy
        required: true
    environment:
      - GRPC_ADDRESS=0.0.0.0:50051
      - METRICS_PORT=9100
      - PRIMARY_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - RUST_LOG=info
    image: ghcr.io/posthog/posthog/personhog-replica:master
    restart: on-failure
  personhog-router:
    depends_on:
      personhog-replica:
        condition: service_started
        required: true
    environment:
      BACKEND_TIMEOUT_MS: "5000"
      GRPC_ADDRESS: 0.0.0.0:50052
      METRICS_PORT: "9101"
      REPLICA_URL: http://personhog-replica:50051
      RUST_LOG: info
    image: ghcr.io/posthog/posthog/personhog-router:master
    restart: on-failure
  plugins:
    command: node nodejs/dist/index.js
    depends_on:
      clickhouse:
        condition: service_started
        required: true
      db:
        condition: service_started
        required: true
      kafka:
        condition: service_started
        required: true
      objectstorage:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
      seaweedfs:
        condition: service_started
        required: true
      valkey:
        condition: service_started
        required: true
    environment:
      - BEHAVIORAL_COHORTS_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - CLICKHOUSE_DATABASE=posthog
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_VERIFY=false
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - KAFKA_HOSTS=kafka:9092
      - PERSONS_DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - REDIS_URL=redis://redis7:6379/
      - CDP_REDIS_HOST=redis7
      - CDP_REDIS_PORT=6379
      - CDP_VALKEY_HOST=valkey
      - CDP_VALKEY_PORT=6379
      - ENCRYPTION_SALT_KEYS=$ENCRYPTION_SALT_KEYS
      - LOGS_REDIS_HOST=redis7
      - LOGS_REDIS_PORT=6379
      - LOGS_REDIS_TLS=false
      - OBJECT_STORAGE_ACCESS_KEY_ID=object_storage_root_user
      - OBJECT_STORAGE_ENABLED=true
      - OBJECT_STORAGE_ENDPOINT=http://objectstorage:19000
      - OBJECT_STORAGE_PUBLIC_ENDPOINT=https://$DOMAIN
      - OBJECT_STORAGE_SECRET_ACCESS_KEY=object_storage_root_password
      - OTEL_EXPORTER_OTLP_ENDPOINT=
      - SECRET_KEY=$POSTHOG_SECRET
      - SITE_URL=https://$DOMAIN
      - TRACES_REDIS_HOST=redis7
      - TRACES_REDIS_PORT=6379
      - TRACES_REDIS_TLS=false
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    restart: on-failure
    volumes:
      - ./share:/share
  property-defs-ai:
    depends_on:
      db:
        condition: service_healthy
        required: true
      kafka-init:
        condition: service_completed_successfully
        required: true
    environment:
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - FILTER_MODE=opt-out
      - KAFKA_HOSTS=kafka:9092
      - SKIP_READS=false
      - SKIP_WRITES=false
      - KAFKA_CONSUMER_GROUP=property-defs-ai
      - KAFKA_CONSUMER_TOPIC=clickhouse_ai_events_json
    image: ghcr.io/posthog/posthog/property-defs-rs:master
    restart: on-failure
  property-defs-rs:
    depends_on:
      db:
        condition: service_healthy
        required: true
      kafka-init:
        condition: service_completed_successfully
        required: true
    environment:
      DATABASE_URL: postgres://posthog:posthog@db:5432/posthog
      FILTER_MODE: opt-out
      KAFKA_HOSTS: kafka:9092
      SKIP_READS: "false"
      SKIP_WRITES: "false"
    image: ghcr.io/posthog/posthog/property-defs-rs:master
    restart: on-failure
  proxy:
    command:
      -c 'set -x && echo "$$CADDYFILE" > /etc/caddy/Caddyfile && echo "$$CADDY_EXTRA_CONFIG" >> /etc/caddy/Caddyfile
      && exec caddy run -c /etc/caddy/Caddyfile'
    depends_on:
      livestream:
        condition: service_started
        required: true
      web:
        condition: service_started
        required: true
    entrypoint: sh
    environment:
      - "CADDYFILE={\n${CADDY_TLS_BLOCK:-}\n}\n${CADDY_HOST:-http://localhost:8000} {\n    @replay-capture {\n        path /s\n\
        \        path /s/\n        path /s/*\n    }\n\n    @capture-ai {\n        path /i/v0/ai\n        path /i/v0/ai/\n  \
        \      path /i/v0/ai/*\n        path /i/v1/ai/events\n        path /i/v1/ai/events/\n    }\n\n    @capture {\n     \
        \   path /e\n        path /e/\n        path /e/*\n        path /i/v0\n        path /i/v0/\n        path /i/v0/*\n  \
        \      path /i/v1/analytics/events\n        path /i/v1/analytics/events/\n        path /batch\n        path /batch/\n\
        \        path /batch/*\n        path /capture\n        path /capture/\n        path /capture/*\n    }\n\n    @capture-logs\
        \ {\n        path /i/v1/logs\n        path /i/v1/logs/\n        path /i/v1/logs/*\n        path /i/v1/traces\n     \
        \   path /i/v1/traces/\n        path /i/v1/traces/*\n        path /i/v1/metrics\n        path /i/v1/metrics/\n     \
        \   path /i/v1/metrics/*\n    }\n\n    @flags {\n        path /flags\n        path /flags/\n        path /flags/*\n\
        \        # Local evaluation (flag definitions) \u2014 mirrors cloud Contour routing to Rust\n        path /api/feature_flag/local_evaluation\n\
        \        path /api/feature_flag/local_evaluation/\n        path /api/feature_flag/local_evaluation/*\n    }\n\n    @surveys\
        \ {\n        path /surveys\n        path /surveys/\n        path /api/surveys\n        path /api/surveys/\n    }\n\n\
        \    @remote-config {\n        path /array/*\n    }\n\n    @webhooks {\n        path /public/webhooks\n        path\
        \ /public/webhooks/\n        path /public/webhooks/*\n        path /public/m/\n        path /public/m/*\n    }\n\n \
        \   @livestream {\n        path /livestream\n        path /livestream/\n        path /livestream/*\n    }\n\n    handle\
        \ @livestream {\n        uri strip_prefix /livestream\n        reverse_proxy livestream:8080 {\n            flush_interval\
        \ -1\n        }\n    }\n\n    handle @capture-ai {\n        reverse_proxy capture-ai:3000\n    }\n\n    handle @capture\
        \ {\n        reverse_proxy capture:3000\n    }\n\n    handle @replay-capture {\n        reverse_proxy replay-capture:3000\n\
        \    }\n\n    handle @capture-logs {\n        reverse_proxy capture-logs:4318\n    }\n\n    handle @flags {\n      \
        \  reverse_proxy feature-flags:3001\n    }\n\n    handle @surveys {\n        reverse_proxy hypercache-server:3002\n\
        \    }\n\n    handle @remote-config {\n        reverse_proxy hypercache-server:3002\n    }\n\n    handle @webhooks {\n\
        \        reverse_proxy plugins:6738\n    }\n\n    @objectstorage {\n        path /posthog\n        path /posthog/\n\
        \        path /posthog/*\n    }\n\n    handle @objectstorage {\n        reverse_proxy objectstorage:19000\n    }\n\n\
        \    handle {\n        reverse_proxy web:8000\n    }\n}\n"
      - CADDY_EXTRA_CONFIG=
      - CADDY_HOST=$DOMAIN, http://, https://
      - CADDY_TLS_BLOCK=$TLS_BLOCK
    image: caddy
    restart: always
    volumes:
      - ./data/proxy-.caddy:/root/.caddy
      - ./data/caddy-data:/data
      - ./data/caddy-config:/config
  recording-api:
    command: node nodejs/dist/index.js
    depends_on:
      clickhouse:
        condition: service_started
        required: true
      db:
        condition: service_started
        required: true
      redis7:
        condition: service_started
        required: true
      seaweedfs:
        condition: service_started
        required: true
    environment:
      - CLICKHOUSE_DATABASE=posthog
      - CLICKHOUSE_HOST=clickhouse
      - CLICKHOUSE_SECURE=false
      - CLICKHOUSE_VERIFY=false
      - DATABASE_URL=postgres://posthog:posthog@db:5432/posthog
      - PLUGIN_SERVER_MODE=recording-api
      - REDIS_URL=redis://redis7:6379/
      - SESSION_RECORDING_API_REDIS_HOST=redis7
      - SESSION_RECORDING_API_REDIS_PORT=6379
      - ENCRYPTION_SALT_KEYS=$ENCRYPTION_SALT_KEYS
      - INTERNAL_API_SECRET=${INTERNAL_API_SECRET:-$POSTHOG_SECRET}
      - SESSION_RECORDING_V2_S3_ACCESS_KEY_ID=any
      - SESSION_RECORDING_V2_S3_ENDPOINT=http://seaweedfs:8333
      - SESSION_RECORDING_V2_S3_SECRET_ACCESS_KEY=any
    image: ${REGISTRY_URL}-node:${POSTHOG_NODE_TAG:-latest}
    restart: on-failure
  redis7:
    command: redis-server --maxmemory-policy allkeys-lru --maxmemory 200mb
    healthcheck:
      interval: 3s
      retries: 10
      test:
        - CMD
        - redis-cli
        - ping
      timeout: 10s
    image: redis:7.2-alpine
    restart: on-failure
    volumes:
      - ./data/redis7-data:/data
  replay-capture:
    environment:
      ADDRESS: 0.0.0.0:3000
      CAPTURE_MODE: recordings
      CAPTURE_OUTPUT_SESSION_REPLAY_MAIN_TOPIC: session_recording_snapshot_item_events
      KAFKA_HOSTS: kafka:9092
      KAFKA_INGESTION_PRODUCER_METADATA_BROKER_LIST: kafka:9092
      KAFKA_TOPIC: session_recording_snapshot_item_events
      REDIS_URL: redis://redis7:6379/
    image: ghcr.io/posthog/posthog/capture:master
    restart: on-failure
  seaweedfs:
    command:
      - server
      - -s3
      - -s3.port=8333
      - -dir=/data
      - -volume.max=1000
    entrypoint:
      - /bin/sh
      - -c
      - "/usr/bin/weed \"$$@\" &\nWEED_PID=$$!\necho \"Waiting for SeaweedFS to initialize...\"\nwhile true; do\n    sleep 5\n\
        \    echo \"Checking if posthog bucket exists...\"\n    if echo \"s3.bucket.list\" | /usr/bin/weed shell -master=localhost:9333\
        \ 2>&1 | grep -q \"posthog\"; then\n        echo \"Bucket posthog exists!\"\n        break\n    fi\n    echo \"Bucket\
        \ not found, attempting to create...\"\n    echo \"s3.bucket.create -name posthog\" | /usr/bin/weed shell -master=localhost:9333\
        \ 2>&1 || true\n    echo \"Retrying in 5s...\"\ndone\necho \"SeaweedFS ready with posthog bucket\"\nwait $$WEED_PID\n"
      - --
    healthcheck:
      interval: 5s
      retries: 30
      start_period: 10s
      test:
        - CMD
        - sh
        - -c
        - echo 's3.bucket.list' | /usr/bin/weed shell -master=localhost:9333 2>&1 | grep -q posthog
      timeout: 10s
    image: chrislusf/seaweedfs:4.29
    restart: on-failure
    volumes:
      - ./data/seaweedfs:/data
  temporal:
    depends_on:
      db:
        condition: service_healthy
        required: true
      elasticsearch:
        condition: service_healthy
        required: true
    environment:
      - DB=postgres12
